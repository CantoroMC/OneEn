[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apy-gme"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "questionary>=2.0",
]

[project.scripts]
gme-download = "gme.download:main"
gme-quotas   = "gme.show_quotas:show_quotas"

[tool.setuptools.packages.find]
where = ["src"]
